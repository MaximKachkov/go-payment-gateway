syntax = "proto3";

package payment.v1;

option go_package = "github.com/MaximKachkov/go-payment-gateway/gen/payment/v1;paymentv1";

import "google/protobuf/timestamp.proto";

service PaymentGateway {
  rpc CreatePayment(CreatePaymentRequest) returns (PaymentResponse);
  rpc ConfirmPayment(ConfirmPaymentRequest) returns (PaymentResponse);
  rpc RefundPayment(RefundPaymentRequest) returns (PaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (PaymentResponse);
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_SUCCEEDED = 2;
  PAYMENT_STATUS_REFUNDED = 3;
  PAYMENT_STATUS_FAILED = 4;
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_PAYMENT = 1;
  TRANSACTION_TYPE_REFUND = 2;
}

message Payment {
  string id = 1;
  int64 amount = 2;
  string currency = 3;
  PaymentStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  repeated Transaction transactions = 7;
}

message Transaction {
  string id = 1;
  string payment_id = 2;
  TransactionType type = 3;
  int64 amount = 4;
  PaymentStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreatePaymentRequest {
  int64 amount = 1;
  string currency = 2;
  string idempotency_key = 3;
}

message ConfirmPaymentRequest {
  string payment_id = 1;
  string idempotency_key = 2;
}

message RefundPaymentRequest {
  string payment_id = 1;
  int64 amount = 2;
  string idempotency_key = 3;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message PaymentResponse {
  Payment payment = 1;
}
